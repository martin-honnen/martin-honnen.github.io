<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheerpJ Mausotron Schematron workbench</title>

  <link rel="stylesheet" href="css/ace-fiddle.css">
  <script src="https://cjrtnc.leaningtech.com/20260803_3439/loader.js"></script>

	<script>
    var gistId = null;
    var gistBaseURI = null;

    var inputBaseURI = 'urn:from-string';
    var codeBaseURI = 'urn:from-string';

    var doneTypingInterval = 1000;
    var typingTimeout;

    var autoEvaluation = false;

    function evaluate() {
      var codeFileInput = document.getElementById('codeFile');
      var codeFileName = codeFileInput != null ? codeFileInput.value : '';
      var inputFileInput = document.getElementById('inputFile');
      var inputFileName = inputFileInput != null ? inputFileInput.value : '';
      //var inputBaseURI = inputFileName != '' && gistId != null ? new URL(inputFileName, gistBaseURI).href : 'urn:from-string';
      //var codeBaseURI = codeFileName != '' && gistId != null ? new URL(codeFileName, gistBaseURI).href : 'urn:from-string';
      schematronValidate(inputEditor.session.getValue(), codeEditor.session.getValue(), codeBaseURI, inputBaseURI, document.getElementById('results'));
    }

    function wait(time) {
      return new Promise(res => setTimeout(res, time));
    }

    function autoEvaluate() {
      typingTimeout = autoEvaluation ? setTimeout(evaluate, doneTypingInterval) : 0;//new Promise(res => setTimeout(evaluate, doneTypingInterval)) : 0;
    }

    function renderXsltResults(results, resultsSelect) {

      resultsSelect.length = 0;

      results.forEach((result, index) => {
        resultsSelect.appendChild(new Option(result.uri, result.uri));
        if (index === 0) {
          writeResult(window.frames['current-result-frame'], result.content);
        }
      });

      resultsSelect.onchange = function (evt) {
        var selectedResult = results[this.selectedIndex];
        setDocument(resultEditor, selectedResult.content, selectedResult.method);

        if (document.getElementById('render-box').checked) {
          writeResult(window.frames['current-result-frame'], results[this.selectedIndex].content);
        }
      };

      setDocument(resultEditor, results[0].content, results[0].method);

    }

    function renderResults(results, resultsSelect) {
      resultsSelect.length = 0;
      var principalResult = results[0];
      setDocument(resultEditor, principalResult, 'xml');
      writeResult(window.frames['current-result-frame'], principalResult);
    }

    var lib = null;

    var mausotronInitialized = false;
    var mainClass = null;

    async function loadLib() {
      await cheerpjInit({ version: 21});

      document.getElementById('cheerpj-load-indicator').style.display = 'none';

      lib = await cheerpjRunLibrary("/app/cheerpj-mausotron/mausotron/mausotron-1.5.jar");

      console.log('Mausotron library initialized');

      document.getElementById('mausotron-load-indicator').style.display = 'none';

      mainClass = await lib.info.mausotron.Main;

      mausotronInitialized = true;
    }

    (async function () {
      await loadLib();
    })();

    async function schematronValidate(input, schematron, inputUri, xsltUri, outputUri) {

      if (mausotronInitialized) {

        try {
          document.getElementById('console').textContent = 'Validating your XML with Schematron...\n';
          cheerpOSAddStringFile("/str/schematron.sch", schematron);
          cheerpOSAddStringFile("/str/sample.xml", input);
          await mainClass.main(["validate", "--verbose", "--report=/files/report.xml", "/str/schematron.sch", "/str/sample.xml"]);
          document.getElementById('console').textContent += `Validation terminated.\n`;
          const reportBlob = await cjFileBlob("/files/report.xml");
          const report = await reportBlob.text();
          document.getElementById('current-result-frame').value = report;
        }
        catch (e) {
          document.getElementById('console').textContent = 'Schematron validation of your XML failed: ' + (typeof e === 'string' ? e : await e.getMessage());
        }

      }
      else {
        console.log('Wait for Mausotron library to be loaded.');
      }


    }


    document.addEventListener('DOMContentLoaded', autoEvaluate, false);
	</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/mode-xml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/mode-html.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/mode-json.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/mode-xquery.js"></script>
</head>
<body class="container">
<header>
    <nav class="grid-row button-bar">
        <h2>Mausotron Schematron Workbench</h2>
        <form id="input-type-form" onsubmit="return false;">
            <!--<fieldset id="input-types">
                <legend>input type</legend>
                <label><input type="radio" name="input-type" value="XML" checked>XML</label>
                <label><input type="radio" name="input-type" value="JSON">JSON</label>
                <label><input type="radio" name="input-type" value="None">No input</label>
            </fieldset>
            <fieldset id="code-types">
                <legend>code type</legend>
                <label><input type="radio" name="code-type" value="XSLT" checked>XSLT</label>
                <label><input type="radio" name="code-type" value="XQuery">XQuery</label>
                <label><input type="radio" name="code-type" value="XPath">XPath</label>
                &lt;!&ndash;<label><input type="radio" name="code-type" value="XSD">XSD</label>&ndash;&gt;
            </fieldset>-->
        </form>
      <label>auto-evaluation <input type="checkbox" id="auto-evaluate"></label>
      <input type="button" id="validate" value="Schematron validation" accesskey="v"
             onclick="var codeFileInput = document.getElementById('codeFile');
                        var codeFileName = codeFileInput != null ? codeFileInput.value : '';
                        var inputFileInput = document.getElementById('inputFile');
                        var inputFileName = inputFileInput != null ? inputFileInput.value : '';
                        var inputBaseURI = inputFileName != '' && gistId != null ? new window.URL(inputFileName, gistBaseURI).href : 'urn:from-string';
                        var codeBaseURI = codeFileName != '' && gistId != null ? new window.URL(codeFileName, gistBaseURI).href : 'urn:from-string';
                        schematronValidate(inputEditor.session.getValue(), codeEditor.session.getValue(), codeBaseURI, inputBaseURI, document.getElementById('results'));">
      <input type="button" id="save" value="save as URL" accesskey="s"
             onclick="save(document.getElementById('input-type-form'));">
    </nav>
</header>
<div id="cheerpj-load-indicator" style="color: red; font-weight: bolder; text-align: center;">CheerpJ is not (yet) initialized.</div>
<div id="mausotron-load-indicator" style="color: red; font-weight: bolder; text-align: center;">Mausotron is not (yet) initialized.</div>
<div class="view-container">

    <main role="main" class="pb-3 view-container">

        <section class="grid-row">
            <div id="input-col" class="grid-item">
                <div id="input-editor" class="editor"></div>
                <input type="button" id="load-input" value="load" onclick="document.getElementById('load-input-file').click();">
                <input type="file" id="load-input-file" onchange="this.files[0].text().then(t => inputEditor.session.setValue(t));" accept=".xml,text/xml,application/xml">
            </div>
            <div class="grid-item">
                <div id="code-editor" class="editor"></div>
                <input type="button" id="load-code" value="load" onclick="document.getElementById('load-code-file').click();">
                <input type="file" id="load-code-file" onchange="this.files[0].text().then(t => codeEditor.session.setValue(t));" accept=".xml,.sch,text/xml,application/xml,application/xml+schematron">
            </div>
        </section>
        <section class="grid-row button-bar">
            <label>
                Result documents:
                <select name="results" id="results"></select>
            </label>
            <label id="render-result">
                render result
                <input type="checkbox" id="render-box" name="render-box">
            </label>
        </section>
        <section class="grid-row">
            <div class="grid-item">
                <pre id="console" class="console"></pre>
                <a id="save-result" onclick="var blob = new Blob([document.getElementById('console').textContent], { type: 'text/plain' }); this.download = 'validationResult.txt'; this.href = window.URL.createObjectURL(blob);">save</a>
            </div>
            <div id="result-frame-container" class="grid-item">
                <textarea id="current-result-frame" name="current-result-frame"></textarea>
            </div>
        </section>

    </main>
</div>


<script src="js/frame-write.js"></script>
<script src="js/ace-modes.js"></script>
<script src="js/ace-editors-init.js"></script>
<script src="js/event-listeners-init.js"></script>
<script src="js/init-examples.js"></script>


</body>
</html>
