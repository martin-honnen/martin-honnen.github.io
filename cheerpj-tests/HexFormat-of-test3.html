<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Java 17 HexFormat.of test</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<script>
(async function () {
  await cheerpjInit({version: 17 });

  const lib = await cheerpjRunLibrary("");

  const MessageDigest = await lib.java.security.MessageDigest;

  const HexFormat = await lib.java.util.HexFormat;

  const String = await lib.java.lang.String;

  const md5 = await MessageDigest.getInstance("MD5");

  const u8 = new TextEncoder().encode("XSLT is great!");

  const i8 = new Int8Array(u8.buffer); //new Int8Array(u8.buffer, u8.byteOffset, u8.byteLength);

  await md5.update(i8);

  const hash = await md5.digest();

  const hexFormat = await HexFormat.of();

  const hexString = await hexFormat.formatHex(hash);

  console.log(hexString.toUpperCase());

})();
</script>
</body>
</html>
