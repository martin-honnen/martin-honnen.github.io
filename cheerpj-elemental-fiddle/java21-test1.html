<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test CheerpJ 5.0 Java 21 support</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>

</head>
<body>
<script>
(async function () {
  await cheerpjInit({ version: 21});
  const lib = await cheerpjRunLibrary("");
  const System = await lib.java.lang.System;
  console.log(`Java version: ${await System.getProperty("java.version")}`);
})();
</script>
</body>
</html>
